<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Skia Banner Preview (Galaxy S8)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    :root {
      --preview-screen-width: 360px;
      --preview-gutter: 24px;
      --preview-panel-width: calc(var(--preview-screen-width) + 2 * var(--preview-gutter));
    }
    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(34, 197, 94, 0.16), transparent 60%),
        radial-gradient(1000px 520px at 85% 0%, rgba(99, 102, 241, 0.18), transparent 58%),
        #0f172a;
      color: #f8fafc;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      height: 56px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      gap: 14px;
      flex-shrink: 0;
    }
    .brand {
      color: #93c5fd;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 15px;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    main {
      flex: 1;
      display: flex;
      overflow: auto;
      min-height: 0;
      gap: 12px;
      padding: 12px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: linear-gradient(165deg, rgba(15, 23, 42, 0.86), rgba(30, 41, 59, 0.72));
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
      overflow: hidden;
    }
    .panel-source,
    .panel-edit {
      flex: 1 1 0;
    }
    .panel-header {
      padding: 11px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.82);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      flex-shrink: 0;
    }
    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .panel-header span {
      color: #93c5fd;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    .effective-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: #86efac;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .copy-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(51, 65, 85, 0.45);
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 220ms ease, border-color 220ms ease;
    }
    .copy-icon-btn:hover {
      background: rgba(71, 85, 105, 0.75);
      border-color: rgba(148, 163, 184, 0.6);
    }
    .copy-icon-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.5);
    }
    .copy-icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .panel-note {
      padding: 8px 14px;
      font-size: 11px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.45);
    }
    .panel-source .panel-note {
      color: #64748b;
    }
    .panel-edit {
      border-color: rgba(74, 222, 128, 0.45);
      box-shadow: 0 12px 34px rgba(22, 163, 74, 0.12), 0 10px 30px rgba(2, 6, 23, 0.35);
    }
    .panel-edit .panel-header {
      background: linear-gradient(120deg, rgba(20, 83, 45, 0.55), rgba(15, 23, 42, 0.9));
      border-bottom-color: rgba(74, 222, 128, 0.35);
    }
    .json-textarea {
      flex: 1;
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      border: none;
      padding: 14px 14px 16px;
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 12px;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 0;
    }
    .json-textarea::placeholder {
      color: #64748b;
    }
    .json-textarea:focus-visible {
      box-shadow: inset 0 0 0 2px rgba(96, 165, 250, 0.55);
    }
    #previewPanel {
      flex: 0 0 var(--preview-panel-width);
      width: var(--preview-panel-width);
      min-width: var(--preview-panel-width);
      min-height: 0;
    }
    #previewContainer {
      flex: 1;
      background:
        radial-gradient(560px 300px at 50% -40px, rgba(59, 130, 246, 0.15), transparent 65%),
        rgba(15, 23, 42, 0.62);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: var(--preview-gutter);
    }
    .preview-fit {
      flex: 1;
      min-height: 0;
      width: 100%;
      container-type: size;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-frame {
      aspect-ratio: 1440 / 2960;
      width: min(var(--preview-screen-width), 100cqw, calc(100cqh * 1440 / 2960));
      max-height: 100cqh;
      background: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.4);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    footer {
      height: 52px;
      background: rgba(15, 23, 42, 0.86);
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .btn {
      border: none;
      padding: 8px 24px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
    }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.5);
    }
    .btn-primary {
      background: #22c55e;
      color: #052e16;
      box-shadow: 0 8px 18px rgba(34, 197, 94, 0.3);
    }
    .btn-primary:hover {
      background: #4ade80;
      transform: translateY(-1px);
    }
    footer .hint {
      font-size: 11px;
      color: #94a3b8;
    }
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 27, 38, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #292e42;
      border-top-color: #bb9af7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #565f89;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
    @media (max-width: 1280px) {
      main {
        flex-direction: column;
      }
      .panel-source,
      .panel-edit {
        flex: 1 1 auto;
        min-height: 320px;
      }
      #previewPanel {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        max-width: var(--preview-panel-width);
        align-self: center;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">正在初始化 Skia (CanvasKit)...</div>
</div>

<header>
  <strong class="brand">Live Banner Tool</strong>
  <span class="status" id="statusText">等待输入 JSON...</span>
</header>

<main>
  <div class="panel panel-source">
    <div class="panel-header">
      <div class="panel-header-row">
        <div class="panel-header-left">
          <span style="color:#cbd5e1;font-weight:600;">完整 JSON</span>
          <span>— s8 + ipad + normal</span>
        </div>
        <button class="copy-icon-btn" onclick="copyFullJson()" title="复制完整 JSON" aria-label="复制完整 JSON">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="10" height="10" rx="2"></rect>
            <rect x="5" y="5" width="10" height="10" rx="2"></rect>
          </svg>
        </button>
      </div>
    </div>
    <div class="panel-note">源数据区：用于粘贴与查看完整配置</div>
    <textarea id="fullJsonEditor" class="json-textarea" placeholder="粘贴完整 banner.json（含 normal、ipad、s8）..." spellcheck="false"></textarea>
  </div>
  <div class="panel panel-edit">
    <div class="panel-header">
      <div class="panel-header-row">
        <div class="panel-header-left">
          <span style="color:#dcfce7;font-weight:700;">S8 编辑</span>
          <span>— 生效编辑区</span>
        </div>
        <span class="effective-badge">Effective</span>
      </div>
    </div>
    <div class="panel-note">仅中间编辑框的修改会作为有效内容参与更新</div>
    <textarea id="s8Editor" class="json-textarea" placeholder="从左侧解析的 s8 数组，在此编辑..." spellcheck="false"></textarea>
  </div>
  <div class="panel" id="previewPanel">
    <div class="panel-header">预览 <span>— S8 · 1440×2960 / 360×740 dp</span></div>
    <div id="previewContainer">
      <div class="preview-fit">
        <div class="preview-frame" id="deviceScreen">
          <div id="emptyPlaceholder" class="empty-state">请在中间栏编辑 S8 JSON 以预览</div>
          <canvas id="skCanvas" style="display:none"></canvas>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <button class="btn btn-primary" id="updateBtn" onclick="applyUpdate()">Update</button>
  <span class="hint">应用当前编辑并更新配置</span>
</footer>

<script src="https://unpkg.com/canvaskit-wasm@0.39.1/bin/full/canvaskit.js"></script>
<script src="app.js"></script>

</body>
</html>
